name: API Automated Test (Newman)
on:
  push:
    branches:
      - main  # Hoặc tên nhánh (branch) bạn muốn kích hoạt workflow khi có push code
jobs:
  run-newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman globally
        run: npm install -g newman
      - name: Run Postman Collection with CSV Data
        run: |
          # Thay thế 'collection.json' bằng đường dẫn thực tế tới file Postman Collection của bạn trong repository
          newman run collection.json -d users.csv
